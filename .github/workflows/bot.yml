
name: SPECAS Discord Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: specas-discord-bot
  cancel-in-progress: false

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiusti projekto failus
        uses: actions/checkout@v4

      - name: Paruosti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Generuoti turnyro paveiksleli
        run: python "bracket_image (1).py"

      - name: Atnaujinti Discord pranesima
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: python bot.py

      - name: Issaugoti paveiksleli
        uses: actions/upload-artifact@v4
        with:
          name: SPECAS-turnyro-lentele
          path: turnyro_lentele.png
