
name: SPECAS Discord Bot

on:
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiusti projekto failus
        uses: actions/checkout@v4

      - name: Paruosti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Patikrinti Firebase rezultatus
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
