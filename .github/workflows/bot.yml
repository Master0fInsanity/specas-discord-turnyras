
name: SPECAS Discord Bot

on:
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Atsisiusti projekto failus
        uses: actions/checkout@v4

      - name: Paruosti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Idiegti bibliotekas
        run: pip install -r requirements.txt

      - name: Generuoti turnyro paveiksleli
        run: python bracket_image.py

      - name: Issaugoti paveiksleli
        uses: actions/upload-artifact@v4
        with:
          name: SPECAS-turnyro-lentele
          path: turnyro_lentele.png
